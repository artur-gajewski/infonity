[project]
name = "local-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "sqlite-vec==0.1.9", "pypdf>=6,<7"]
[project.optional-dependencies]
speech = ["faster-whisper>=1.2,<2", "av>=11,<17"]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["app"]
[tool.setuptools.package-data]
app = ["*.txt", "migrations/*.sql"]
